<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">ORL-VIS method overview</title>
  <desc id="desc">A schematic overview of CD-MIA, MoE-Adapter segmenter, and MoE-HQP tracker for occlusion-robust long video instance segmentation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="700" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a">ORL-VIS: Occlusion-Robust Long Video Instance Segmentation</text>
  <text x="700" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569">Temporal decoupling and hierarchical query propagation for long videos with occlusion and reappearance</text>

  <g filter="url(#shadow)">
    <rect x="58" y="172" width="260" height="380" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="188" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0f172a">Short Training Clips</text>
    <g transform="translate(88 254)">
      <rect x="0" y="0" width="190" height="92" rx="14" fill="#e0f2fe" stroke="#38bdf8"/>
      <circle cx="48" cy="48" r="22" fill="#f97316"/>
      <rect x="90" y="24" width="72" height="48" rx="10" fill="#22c55e"/>
      <path d="M36 74 C70 38 118 82 162 36" fill="none" stroke="#0f172a" stroke-width="5" opacity="0.35"/>
    </g>
    <g transform="translate(88 374)">
      <rect x="0" y="0" width="190" height="92" rx="14" fill="#fef3c7" stroke="#f59e0b"/>
      <circle cx="54" cy="48" r="22" fill="#ef4444"/>
      <rect x="84" y="22" width="78" height="52" rx="10" fill="#3b82f6"/>
      <rect x="120" y="16" width="54" height="64" rx="10" fill="#0f172a" opacity="0.18"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="400" y="158" width="292" height="410" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="424" y="184" width="244" height="48" rx="24" fill="#dbeafe"/>
    <text x="546" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">CD-MIA</text>
    <text x="546" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Cross-Dataset Multi-Instance</text>
    <text x="546" y="288" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Online Augmentation</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">
      <text x="438" y="340">1. Sample auxiliary instances</text>
      <text x="438" y="380">2. Filter masks and scales</text>
      <text x="438" y="420">3. Paste into target clips</text>
      <text x="438" y="460">4. Simulate disappearance</text>
      <text x="438" y="500">5. Reappear with valid labels</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="776" y="158" width="292" height="410" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="800" y="184" width="244" height="48" rx="24" fill="#dcfce7"/>
    <text x="922" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#15803d">MoE-Adapter Segmenter</text>
    <g transform="translate(824 270)">
      <rect x="0" y="0" width="196" height="54" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="98" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">Frozen Backbone</text>
      <rect x="0" y="78" width="196" height="54" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="98" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">Pixel Decoder</text>
      <rect x="0" y="156" width="196" height="54" rx="12" fill="#ecfdf5" stroke="#22c55e"/>
      <text x="98" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#166534">MoE Experts + Head</text>
    </g>
    <text x="922" y="522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">Object embeddings and ReID features</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1140" y="158" width="204" height="410" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="1162" y="184" width="160" height="48" rx="24" fill="#fef3c7"/>
    <text x="1242" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#b45309">MoE-HQP Tracker</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">
      <text x="1170" y="296">Noise simulation</text>
      <text x="1170" y="338">MoE temporal block</text>
      <text x="1170" y="380">Hierarchical query</text>
      <text x="1170" y="422">Semantic + geometric</text>
      <text x="1170" y="464">identity propagation</text>
    </g>
    <rect x="1172" y="502" width="140" height="42" rx="12" fill="url(#blue)"/>
    <text x="1242" y="529" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Masks + IDs</text>
  </g>

  <path d="M324 362 H390" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M700 362 H766" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1076 362 H1130" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(124 612)">
    <rect x="0" y="0" width="1152" height="76" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="34" y="32" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Core idea</text>
    <text x="34" y="58" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">Expose training to occlusion/reappearance, route heterogeneous temporal dynamics to specialized experts, and propagate hierarchical identity cues across frames.</text>
  </g>
</svg>
